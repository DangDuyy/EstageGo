#     embeddings:
#       model_group: gemini_embeddings
#     vector_store:
#       type: "faiss"
#       source: "./docs"

policies:
  - name: FlowPolicy
  - name: EnterpriseSearchPolicy
    priority: 6
    vector_store:
      type: "custom_retrievers.ActiveFilteredQdrantRetriever"
      threshold: 0.5
    llm:
      model_group: groq_llm
    embeddings:
      model_group: gemini_embeddings
