version: "3.1"

rules:
  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye
  
  - rule: Activate property search form
    steps:
      - intent: search_property
      - action: property_search_form
      - active_loop: property_search_form
  
  - rule: Submit property search form
    condition:
      - active_loop: property_search_form
    steps:
      - action: property_search_form
      - active_loop: null
      - action: action_submit_property_search_form
  
  - rule: Handle form interruption with goodbye
    condition:
      - active_loop: property_search_form
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - action: action_deactivate_loop
      - active_loop: null