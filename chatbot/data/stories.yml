      - intent: search_property
        entities:
          - province
          - district
      - action: action_search_property
      - intent: goodbye
      - action: utter_goodbye
  
  - story: search with province only
    steps:
      - intent: search_property
        entities:
          - province
      - action: action_search_property
  
