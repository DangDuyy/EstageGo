version: "3.1"

stories:
  - story: complete search with all info at once
    steps:
      - intent: greet
      - action: utter_greet
      - intent: search_property
        entities:
          - province: "TP.HCM"
          - district: "Quận 1"
          - ward: "Phường Bến Nghé"
      - action: property_search_form
      - active_loop: property_search_form
      - active_loop: null
      - action: action_submit_property_search_form
      - intent: goodbye
      - action: utter_goodbye
  
  - story: search with progressive info - province first
    steps:
      - intent: greet
      - action: utter_greet
      - intent: search_property
      - action: property_search_form
      - active_loop: property_search_form
      - slot_was_set:
        - requested_slot: province
      - intent: inform
        entities:
          - province: "TP.HCM"
      - slot_was_set:
        - province: "TP.HCM"
      - slot_was_set:
        - requested_slot: district
      - intent: inform
        entities:
          - district: "Quận 1"
      - slot_was_set:
        - district: "Quận 1"
      - slot_was_set:
        - requested_slot: ward
      - intent: inform
        entities:
          - ward: "Phường Bến Nghé"
      - slot_was_set:
        - ward: "Phường Bến Nghé"
      - slot_was_set:
        - requested_slot: null
      - active_loop: null
      - action: action_submit_property_search_form
  
  - story: search with province only then complete
    steps:
      - intent: search_property
        entities:
          - province: "Hà Nội"
      - action: property_search_form
      - active_loop: property_search_form
      - slot_was_set:
        - province: "Hà Nội"
      - slot_was_set:
        - requested_slot: district
      - intent: inform
        entities:
          - district: "Quận Ba Đình"
      - slot_was_set:
        - district: "Quận Ba Đình"
      - slot_was_set:
        - requested_slot: ward
      - intent: deny
      - slot_was_set:
        - ward: "bỏ qua"
      - slot_was_set:
        - requested_slot: null
      - active_loop: null
      - action: action_submit_property_search_form
  
  - story: search with province and district
    steps:
      - intent: search_property
        entities:
          - province: "Đà Nẵng"
          - district: "Quận Hải Châu"
      - action: property_search_form
      - active_loop: property_search_form
      - slot_was_set:
        - province: "Đà Nẵng"
        - district: "Quận Hải Châu"
      - slot_was_set:
        - requested_slot: ward
      - intent: inform
        entities:
          - ward: "Phường Thuận Phước"
      - slot_was_set:
        - ward: "Phường Thuận Phước"
      - slot_was_set:
        - requested_slot: null
      - active_loop: null
      - action: action_submit_property_search_form
  
  - story: skip ward info
    steps:
      - intent: search_property
      - action: property_search_form
      - active_loop: property_search_form
      - slot_was_set:
        - requested_slot: province
      - intent: inform
        entities:
          - province: "TP.HCM"
      - slot_was_set:
        - requested_slot: district
      - intent: inform
        entities:
          - district: "Quận 3"
      - slot_was_set:
        - requested_slot: ward
      - intent: deny
      - slot_was_set:
        - ward: "bỏ qua"
      - active_loop: null
      - action: action_submit_property_search_form
  
  - story: simple greeting
    steps:
      - intent: greet
      - action: utter_greet
      - intent: goodbye
      - action: utter_goodbye
  
  - story: direct search no greeting
    steps:
      - intent: search_property
        entities:
          - province: "Hà Nội"
          - district: "Quận Hoàn Kiếm"
          - ward: "Phường Hàng Bạc"
      - action: property_search_form
      - active_loop: property_search_form
      - active_loop: null
      - action: action_submit_property_search_form