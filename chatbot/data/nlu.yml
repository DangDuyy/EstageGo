    examples: |
      - Hồ Chí Minh
      - Thành phố Hồ Chí Minh
      - Sài Gòn
      - HCM
      - TPHCM
  
  - synonym: "Hà Nội"
    examples: |
      - Ha Noi
      - Thủ đô
      - HN