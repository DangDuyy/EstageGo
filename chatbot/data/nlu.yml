version: "3.1"

nlu:
  - intent: greet
    examples: |
      - xin chào
      - chào bạn
      - hello
      - hi
      - chào
      - hey
  
  - intent: goodbye
    examples: |
      - tạm biệt
      - bye
      - goodbye
      - hẹn gặp lại
      - cảm ơn tạm biệt
  
  - intent: affirm
    examples: |
      - có
      - đúng
      - đúng rồi
      - ok
      - được
      - chắc chắn
  
  - intent: deny
    examples: |
      - không
      - không phải
      - sai rồi
      - chưa đúng
  
  - intent: search_property
    examples: |
      - tôi muốn mua nhà ở [TP.HCM](province), [Quận 1](district), [Phường Bến Nghé](ward)
      - tìm nhà tại [Hà Nội](province), [Quận Ba Đình](district), [Phường Ngọc Hà](ward)
      - có nhà nào ở [Đà Nẵng](province) không
      - tôi cần tìm nhà ở [Hồ Chí Minh](province), [Quận 3](district)
      - nhà tại [Hà Nội](province), [Quận Hoàn Kiếm](district), [Phường Hàng Bạc](ward)
      - tìm bất động sản ở [TP.HCM](province), [Quận 2](district), [Phường Thảo Điền](ward)
      - mua nhà [Bình Dương](province), [Thành phố Thủ Dầu Một](district)
      - tôi muốn mua nhà ở [Thành phố Hồ Chí Minh](province)
